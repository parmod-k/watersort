<script>
  // Dynamic Pouring Cycle Interactive Logic
  (function initPourController() {
    const toggleBtn = document.getElementById('toggle-pour-btn');
    const btnText = document.getElementById('pour-btn-text');
    const btnIcon = document.getElementById('pour-btn-icon');
    const sourceTube = document.getElementById('source-tube');
    const targetTube = document.getElementById('target-tube');
    const movesCounter = document.getElementById('moves-count');

    let isPouring = true;

    if (!toggleBtn) return;

    toggleBtn.addEventListener('click', () => {
      isPouring = !isPouring;

      if (isPouring) {
        // Resume dynamic tilt & streaming
        sourceTube.style.transform = 'rotate(58deg)';
        btnText.textContent = 'Pause';
        btnIcon.textContent = 'pause';
      } else {
        // Upright & stop stream
        sourceTube.style.transform = 'rotate(0deg) translateY(-14px)';
        btnText.textContent = 'Resume';
        btnIcon.textContent = 'play_arrow';
        if (movesCounter) {
          movesCounter.textContent = parseInt(movesCounter.textContent, 10) + 1;
        }
      }
    });
  })();
