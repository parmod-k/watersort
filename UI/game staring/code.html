<button class="h-12 px-space-xl rounded-full bg-gradient-to-r from-primary-fixed-dim via-primary-container to-primary-fixed text-on-primary-fixed font-headline-sm text-headline-sm flex items-center gap-space-sm shadow-[0_5px_0_#009bb0,0_12px_20px_rgba(0,229,255,0.3)] active:translate-y-1 active:shadow-[0_2px_0_#009bb0] transition-all" id="demo-btn">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span>Demo Pour</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface-container-high/90 flex flex-col items-center justify-center text-on-surface hover:text-primary transition-all active:scale-90 shadow-[inset_0_1px_1px_rgba(255,255,255,0.2),0_4px_12px_rgba(0,0,0,0.3)]" id="restart-btn">
<span class="material-symbols-outlined text-[20px]">refresh</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface-container-high/90 flex flex-col items-center justify-center text-on-surface hover:text-primary transition-all active:scale-90 shadow-[inset_0_1px_1px_rgba(255,255,255,0.2),0_4px_12px_rgba(0,0,0,0.3)] relative" id="add-tube-btn">
<span class="material-symbols-outlined text-[20px]">add</span>
<span class="absolute -top-1 -right-1 px-1.5 py-0.5 rounded-full bg-secondary text-on-secondary font-label-sm text-[10px] flex items-center justify-center shadow-md">+1</span>
</button>
</div>
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 px-space-md py-space-xs rounded-full bg-surface-bright/95 text-on-surface backdrop-blur-md shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 font-label-md text-label-md flex items-center gap-space-xs z-50" id="toast">
<span class="material-symbols-outlined text-[18px] text-primary" id="toast-icon">info</span>
<span id="toast-text">Poured neon cyan!</span>
</div>
</div>
<script>
(function initWaterSort() {
  let selectedTubeId = null;
  let isAnimating = false;
  let moveCount = 14;

  const tubeData = {
    0: ['purple', 'yellow', 'coral', 'cyan'],
    1: ['coral', 'cyan', 'purple', 'yellow'],
    2: ['emerald', 'emerald', 'emerald', 'emerald'],
    3: ['yellow', 'coral', 'purple'],
    4: ['cyan'],
    5: []
  };

  const colorStyles = {
    cyan: 'linear-gradient(90deg, #67e8f9 0%, #00e5ff 50%, #0891b2 100%)',
    coral: 'linear-gradient(90deg, #ff8a70 0%, #ff6b4a 50%, #c43212 100%)',
    emerald: 'linear-gradient(90deg, #34d399 0%, #10e599 50%, #059669 100%)',
    purple: 'linear-gradient(90deg, #d946ef 0%, #a855f7 50%, #7e22ce 100%)',
    yellow: 'linear-gradient(90deg, #fde047 0%, #facc15 50%, #ca8a04 100%)'
  };

  const tubes = document.querySelectorAll('.tube-item');
  const movesDisplay = document.getElementById('moves-count');
  const stream = document.getElementById('pour-stream');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toast-text');

  function showToast(msg, icon = 'info') {
    toastText.innerText = msg;
    const toastIcon = document.getElementById('toast-icon');
    if (toastIcon) toastIcon.innerText = icon;
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');
    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0');
    }, 1800);
  }

  function deselectAll() {
    tubes.forEach(t => {
      t.style.transform = '';
      t.firstElementChild.classList.remove('ring-4', 'ring-primary-container', 'shadow-[0_0_24px_rgba(0,229,255,0.6)]');
    });
    selectedTubeId = null;
  }

  function selectTube(id) {
    deselectAll();
    selectedTubeId = id;
    const tubeEl = document.getElementById(`tube-${id}`);
    if (tubeEl) {
      tubeEl.style.transform = 'translateY(-24px)';
      tubeEl.firstElementChild.classList.add('ring-4', 'ring-primary-container', 'shadow-[0_0_24px_rgba(0,229,255,0.6)]');
    }
  }

  function executePour(sourceId, targetId, callback) {
    if (isAnimating) return;
    isAnimating = true;

    const sourceTube = document.getElementById(`tube-${sourceId}`);
    const targetTube = document.getElementById(`tube-${targetId}`);
    const sourceColors = tubeData[sourceId];
    const targetColors = tubeData[targetId];

    if (!sourceColors || sourceColors.length === 0) {
      deselectAll();
      isAnimating = false;
      return;
    }

    const pouredColor = sourceColors[sourceColors.length - 1];

    const sRect = sourceTube.getBoundingClientRect();
    const tRect = targetTube.getBoundingClientRect();
    const isTargetLeft = tRect.left < sRect.left;
    const angle = isTargetLeft ? -65 : 65;

    sourceTube.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
    const moveX = (tRect.left - sRect.left) * 0.75;
    const moveY = (tRect.top - sRect.top) - 60;
    sourceTube.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${angle}deg)`;

    setTimeout(() => {
      const spoutX = isTargetLeft ? sRect.left + moveX + 8 : sRect.left + moveX + 48;
      const spoutY = sRect.top + moveY + 25;
      const targetTopX = tRect.left + 28;
      const targetTopY = tRect.top + 20 + (4 - targetColors.length - 1) * 35;

      const cX = (spoutX + targetTopX) / 2;
      stream.setAttribute('d', `M ${spoutX} ${spoutY} Q ${cX} ${spoutY + 20} ${targetTopX} ${targetTopY}`);
      stream.setAttribute('stroke-width', '7');

      const sourceInner = sourceTube.querySelector('.rounded-b-full.bg-surface-container-lowest\\/50');
      const layers = sourceInner.querySelectorAll('.liquid-layer');
      if (layers.length > 0) {
        const topLayer = layers[layers.length - 1];
        topLayer.style.height = '0%';
        topLayer.style.opacity = '0.3';
      }

      const targetInner = targetTube.querySelector('.rounded-b-full.bg-surface-container-lowest\\/50');
      const newLayer = document.createElement('div');
      newLayer.className = 'liquid-layer w-full h-0 relative transition-all duration-500 overflow-hidden';
      newLayer.style.background = colorStyles[pouredColor];
      newLayer.innerHTML = '<div class="absolute -top-1 left-0 right-0 h-2 rounded-full bg-white/40 blur-[0.5px]"></div><div class="absolute inset-0 bg-gradient-to-r from-white/20 via-transparent to-black/20"></div>';
      targetInner.appendChild(newLayer);

      setTimeout(() => {
        newLayer.style.height = '25%';
      }, 50);

      setTimeout(() => {
        stream.setAttribute('stroke-width', '0');
        stream.setAttribute('d', '');

        sourceTube.style.transition = 'transform 0.4s ease-out';
        sourceTube.style.transform = '';

        sourceColors.pop();
        targetColors.push(pouredColor);

        const currentLayers = sourceInner.querySelectorAll('.liquid-layer');
        if (currentLayers.length > 0) {
          sourceInner.removeChild(currentLayers[currentLayers.length - 1]);
        }

        moveCount++;
        movesDisplay.innerText = moveCount;

        deselectAll();
        isAnimating = false;
        showToast(`Poured ${pouredColor}!`, 'water_drop');
        if (callback) callback();
      }, 550);
    }, 400);
  }

  tubes.forEach(tube => {
    tube.addEventListener('click', () => {
      if (isAnimating) return;
      const id = parseInt(tube.getAttribute('data-tube-id'), 10);

      if (id === 2) {
        showToast('Tube completed!', 'star');
        return;
      }

      if (selectedTubeId === null) {
        if (tubeData[id].length > 0) {
          selectTube(id);
        }
      } else if (selectedTubeId === id) {
        deselectAll();
      } else {
        const sourceId = selectedTubeId;
        const targetId = id;
        const sourceColors = tubeData[sourceId];
        const targetColors = tubeData[targetId];

        const topSourceColor = sourceColors[sourceColors.length - 1];
        const topTargetColor = targetColors[targetColors.length - 1];

        const isValid = targetColors.length < 4 && (targetColors.length === 0 || topTargetColor === topSourceColor);

        if (isValid) {
          executePour(sourceId, targetId);
        } else {
          showToast('Invalid Move!', 'block');
          deselectAll();
        }
      }
    });
  });

  const demoBtn = document.getElementById('demo-btn');
  demoBtn.addEventListener('click', () => {
    if (isAnimating) return;
    if (tubeData[0].length > 0 && tubeData[4].length < 4) {
      selectTube(0);
      setTimeout(() => {
        executePour(0, 4);
      }, 350);
    } else if (tubeData[1].length > 0 && tubeData[5].length < 4) {
      selectTube(1);
      setTimeout(() => {
        executePour(1, 5);
      }, 350);
    } else {
      showToast('No demo moves left!', 'info');
    }
  });

  const hintBtn = document.getElementById('hint-btn');
  hintBtn.addEventListener('click', () => {
    showToast('Hint: Pour cyan from Tube 1 to Tube 5', 'lightbulb');
    const t0 = document.getElementById('tube-0');
    t0.classList.add('animate-bounce');
    setTimeout(() => t0.classList.remove('animate-bounce'), 1000);
  });

  const undoBtn = document.getElementById('undo-btn');
  undoBtn.addEventListener('click', () => {
    showToast('Previous move undone', 'undo');
  });

  const restartBtn = document.getElementById('restart-btn');
  restartBtn.addEventListener('click', () => {
    showToast('Restarting level...', 'refresh');
  });

  const addTubeBtn = document.getElementById('add-tube-btn');
  addTubeBtn.addEventListener('click', () => {
    showToast('Extra tube added!', 'add');
  });
})();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-4px_24px_rgba(0,0,0,0.4)]" data-active-classes="text-primary-container font-bold"><div class="h-20 px-margin flex items-center justify-around max-w-[560px] mx-auto w-full"><a aria-current="page" class="relative flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-md py-space-xs rounded-lg transition-all active:scale-95 text-primary-container font-bold" data-path="main-puzzle-stage" href="#"><span class="material-symbols-outlined text-[24px]">play_circle</span><span class="font-label-sm text-label-sm mt-space-xs">Play</span></a><a class="relative flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-md py-space-xs rounded-lg text-on-surface-variant hover:text-on-surface transition-all active:scale-95" data-path="level-select-map" href="#"><span class="material-symbols-outlined text-[24px]">map</span><span class="font-label-sm text-label-sm mt-space-xs">Stages</span></a><a class="relative flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-md py-space-xs rounded-lg text-on-surface-variant hover:text-on-surface transition-all active:scale-95" data-path="vials-and-themes-shop" href="#"><span class="material-symbols-outlined text-[24px]">palette</span><span class="font-label-sm text-label-sm mt-space-xs">Themes</span></a><a class="relative flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-md py-space-xs rounded-lg text-on-surface-variant hover:text-on-surface transition-all active:scale-95" data-path="leaderboard-and-events" href="#"><span class="material-symbols-outlined text-[24px]">trophy</span><span class="font-label-sm text-label-sm mt-space-xs">Rank</span></a></div></nav></body></html>
